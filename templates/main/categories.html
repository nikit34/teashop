{% load i18n %}

<nav class="category-chips" aria-label="{% trans 'Categories' %}">
    <a class="chip {% if not active_category %}active{% endif %}" href="{% url 'home' %}">{% trans "All" %}</a>
    {% for category in categories %}
        <a class="chip {% if active_category and active_category.pk == category.pk %}active{% endif %}" href="{% url 'home' %}?category={% firstof category.slug category.name %}">{{ category.name }}</a>
    {% endfor %}
</nav>
