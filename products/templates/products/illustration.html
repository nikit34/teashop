<div class="illu illu-{{ icon|default:'default' }}">
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    {% if icon == 'gift' %}
        <rect x="12" y="27" width="40" height="25" rx="3"/>
        <rect x="9" y="19" width="46" height="9" rx="2"/>
        <path d="M32 19v33"/>
        <path d="M32 19c-3-7-12-9-13-4-1 4 8 5 13 4z"/>
        <path d="M32 19c3-7 12-9 13-4 1 4-8 5-13 4z"/>
    {% elif icon == 'star' %}
        <path d="M32 9l6.2 13.6 14.8 1.6-11 10 3.2 14.8L32 41.6 18.8 49l3.2-14.8-11-10 14.8-1.6z"/>
        <path d="M52 44v6M49 47h6M12 12v5M9.5 14.5h5"/>
    {% elif icon == 'tin' %}
        <rect x="7" y="17" width="50" height="30" rx="11"/>
        <rect x="12" y="22" width="40" height="20" rx="7"/>
        <path d="M19 32c6-6.5 15-6.5 21 0-6 6.5-15 6.5-21 0z"/>
        <path d="M40 32l6-4.5v9z"/>
        <circle cx="24" cy="31" r="1.3" fill="currentColor" stroke="none"/>
    {% elif icon == 'bottle' %}
        <path d="M28 7h8v9l4.5 6.5V53a4 4 0 0 1-4 4h-9a4 4 0 0 1-4-4V22.5L28 16z"/>
        <path d="M23.5 33h17M23.5 47h17"/>
        <path d="M32 36c-2.6 2.8-2.6 5 0 6.2 2.6-1.2 2.6-3.4 0-6.2z"/>

        <path d="M13 27h31v11a12 12 0 0 1-12 12h-7a12 12 0 0 1-12-12z"/>
        <path d="M44 30.5h3.5a5.5 5.5 0 0 1 0 11H43"/>

        <path d="M10 55h40"/>
    {% elif icon == 'leaf' %}
        <path d="M51 13C25 13 12 27 14 50c21 2.5 37-11 37-37z"/>
        <path d="M14 50c9-11 20-20 31-27"/>
        <path d="M27 38.5l-1.5-8M35 32l-.5-7"/>
    {% elif icon == 'jar' %}
        <rect x="21" y="11" width="22" height="8" rx="2"/>
        <path d="M23 19h18v5H23z"/>
        <rect x="17" y="24" width="30" height="31" rx="7"/>
        <path d="M32 33l5 2.9v5.8L32 44.6l-5-2.9v-5.8z"/>
    {% elif icon == 'nut' %}
        <path d="M32 9c12 9 17 25 9 38-4 7-14 7-18 0-8-13-3-29 9-38z"/>
        <path d="M32 15c4 9 4 22 0 32"/>
    {% elif icon == 'salt' %}
        <path d="M23 25h18l-2.5 29h-13z"/>
        <path d="M23 25c0-9 18-9 18 0"/>
        <circle cx="28.5" cy="19" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="32" cy="17.5" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="35.5" cy="19" r="1.2" fill="currentColor" stroke="none"/>
    {% elif icon == 'cork' %}
        <circle cx="32" cy="32" r="21"/>
        <circle cx="32" cy="32" r="14"/>
        <circle cx="27" cy="27" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="36" cy="29" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="30" cy="37" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="38" cy="37" r="1.4" fill="currentColor" stroke="none"/>
    {% else %}
        <path d="M10 26h44l-5 26H15z"/>
        <path d="M20 26l8-13M44 26l-8-13"/>
        <path d="M22 34v10M32 34v10M42 34v10"/>
    {% endif %}

</div>
